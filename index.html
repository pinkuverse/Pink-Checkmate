
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurrBounce ♡</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #ffe8f2;
  font-family: 'Trebuchet MS', sans-serif;
  touch-action: none;
}

canvas {
  display: block;
  width: 100vw;
  height: 100dvh;
}

#hud {
  position: fixed;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 7px;
  pointer-events: none;
}

.tag {
  background: white;
  color: #db6999;
  padding: 10px 13px;
  border-radius: 18px;
  box-shadow: 0 4px #f3c1d6;
  font-weight: bold;
  font-size: 13px;
}

#progress {
  position: fixed;
  top: 62px;
  left: 15px;
  right: 15px;
  height: 8px;
  border-radius: 10px;
  background: #ffffffa8;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0%;
  background: #f47fac;
  border-radius: 10px;
}

#controls {
  position: fixed;
  bottom: 18px;
  left: 0;
  right: 0;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.group {
  display: flex;
  gap: 12px;
}

.ctrl {
  pointer-events: auto;
  width: 64px;
  height: 64px;
  border: 3px solid white;
  border-radius: 22px;
  background: #ff9fc5;
  color: white;
  font-size: 25px;
  box-shadow: 0 5px #df729f;
  touch-action: none;
}

.ctrl:active {
  transform: translateY(4px);
  box-shadow: 0 1px #df729f;
}

#screen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe9f2df;
  padding: 20px;
}

.panel {
  width: min(370px, 92vw);
  padding: 30px 25px;
  background: white;
  text-align: center;
  border-radius: 30px;
  box-shadow: 0 9px #f2bfd6;
}

.panel h1 {
  color: #eb79a8;
  font-size: 34px;
  margin-bottom: 8px;
}

.panel p {
  color: #a77a90;
  line-height: 1.6;
  margin: 14px 0;
}

#play {
  border: 0;
  border-radius: 20px;
  background: #ff91b9;
  color: white;
  font-weight: bold;
  font-size: 17px;
  padding: 14px 30px;
  cursor: pointer;
}

#play:hover {
  background: #ed75a6;
}

.note {
  color: #c69aaf;
  font-size: 12px;
  margin-top: 15px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="tag">🐱 PurrBounce</div>
  <div class="tag" id="level">LEVEL 01 / 100</div>
  <div class="tag" id="gems">💗 0</div>
</div>

<div id="progress"><div id="bar"></div></div>

<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <button class="ctrl" id="jump">↑</button>
</div>

<div id="screen">
  <div class="panel">
    <h1>🐱 PurrBounce</h1>
    <p id="description">
      Welcome to PurrBounce! ♡<br><br>
      Help your fluffy pink kitty explore
      the grassy world, jump over obstacles
      and collect cute little hearts!
    </p>
    <button id="play">START ADVENTURE ♡</button>
    <div class="note">100 levels of fluffy fun!</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H, groundY;
let camera = 0;
let running = false;
let level = 1;
let hearts = 0;
let worldEnd = 1900;
let obstacles = [];
let collectibles = [];
let flowers = [];
let particles = [];
let keys = {};

const input = {
  left: false,
  right: false,
  jump: false
};

const cat = {
  x: 100,
  y: 0,
  vx: 0,
  vy: 0,
  r: 23,
  grounded: false,
  rotation: 0,
  expression: "happy",
  expressionTime: 0,
  squash: 0
};

const gravity = 0.48;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  groundY = H - 100;

  if (!running) {
    cat.y = groundY - cat.r;
  }
}

addEventListener("resize", resize);
resize();

function random(seed) {
  let x = Math.sin(seed * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

// GENERATE 100 LEVELS
function buildLevel(n) {
  obstacles = [];
  collectibles = [];
  flowers = [];

  worldEnd = 1900 + n * 45;

  // Difficulty increases gradually.
  const count = Math.min(4 + Math.floor(n * 0.35), 22);

  let previousX = 300;

  for (let i = 0; i < count; i++) {
    let x = previousX + 230 + random(n * 100 + i) * 130;

    if (x > worldEnd - 250) break;

    const difficulty = Math.min(n / 100, 1);
    const typeRoll = random(n * 200 + i);

    let type = "mushroom";

    if (typeRoll > 0.75) type = "rock";
    else if (typeRoll > 0.48) type = "log";
    else if (typeRoll > 0.25) type = "mushroom";

    // Spikes only appear in later levels.
    if (n > 12 && typeRoll > 0.91) {
      type = "spikes";
    }

    obstacles.push({
      x,
      type,
      w: type === "log" ? 65 :
         type === "spikes" ? 55 : 40,
      h: type === "log" ? 28 :
         type === "spikes" ? 25 :
         type === "rock" ? 35 : 45
    });

    // Collectible hearts
    if (i % 2 === 0) {
      collectibles.push({
        x: x + 100,
        taken: false,
        y: groundY - 85 - random(n + i) * 25
      });
    }

    previousX = x;
  }

  // Flowers along the grass
  for (let i = 0; i < worldEnd / 70; i++) {
    flowers.push({
      x: i * 70 + random(i + n) * 30,
      height: 8 + random(i * 3 + n) * 15,
      color: i % 3
    });
  }
}

// DRAW GRASS
function drawGround() {
  ctx.fillStyle = "#a9d85f";
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.fillStyle = "#7fbd42";
  ctx.fillRect(0, groundY + 9, W, H - groundY);

  ctx.fillStyle = "#d3f18a";
  ctx.fillRect(0, groundY, W, 7);

  // Little blades of grass
  for (let i = 0; i < 90; i++) {
    let x = ((i * 73 - camera) % (W + 100) + W + 100) % (W + 100);

    ctx.strokeStyle = "#8dc64c";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, groundY + 3);
    ctx.lineTo(x - 3, groundY - 5);
    ctx.stroke();
  }
}

// BACKGROUND
function drawBackground() {
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#fff1f8");
  g.addColorStop(1, "#ffd8e9");

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  for (let i = 0; i < 10; i++) {
    let x = ((i * 190 - camera * .2) % (W + 250) + W + 250) % (W + 250) - 100;
    let y = 90 + (i % 3) * 65;

    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 23, y - 12, 27, 0, Math.PI * 2);
    ctx.arc(x + 48, y, 19, 0, Math.PI * 2);
    ctx.fill();
  }

  // Distant hills
  ctx.fillStyle = "#f4c0d8";
  ctx.beginPath();
  ctx.moveTo(0, groundY);

  for (let x = 0; x <= W + 10; x += 10) {
    ctx.lineTo(
      x,
      groundY - 55 + Math.sin((x + camera * .12) / 100) * 22
    );
  }

  ctx.lineTo(W, groundY);
  ctx.fill();
}

// FLOWERS
function drawFlowers() {
  for (const f of flowers) {
    let x = f.x - camera;

    if (x < -20 || x > W + 20) continue;

    ctx.strokeStyle = "#73aa42";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x, groundY - f.height);
    ctx.stroke();

    let y = groundY - f.height;

    const colors = ["#ff9bc5", "#fff1a1", "#ffffff"];

    ctx.fillStyle = colors[f.color];

    for (let a = 0; a < 5; a++) {
      let angle = a * Math.PI * 2 / 5;
      ctx.beginPath();
      ctx.arc(
        x + Math.cos(angle) * 5,
        y + Math.sin(angle) * 5,
        3.5, 0, Math.PI * 2
      );
      ctx.fill();
    }

    ctx.fillStyle = "#f4c84e";
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// OBSTACLES
function drawObstacles() {
  for (const o of obstacles) {
    let x = o.x - camera;
    let y = groundY - o.h;

    if (x < -100 || x > W + 100) continue;

    if (o.type === "mushroom") {
      // Stem
      ctx.fillStyle = "#fff1dc";
      ctx.fillRect(x + 13, y + 17, 15, 28);

      // Cap
      ctx.fillStyle = "#ff9dbd";
      ctx.beginPath();
      ctx.ellipse(x + 20, y + 17, 23, 17, 0, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(x + 12, y + 10, 3, 0, Math.PI * 2);
      ctx.arc(x + 28, y + 7, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (o.type === "rock") {
      ctx.fillStyle = "#b7a8a9";
      ctx.beginPath();
      ctx.ellipse(x + 20, y + 18, 22, 19, -.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e0d2d3";
      ctx.beginPath();
      ctx.arc(x + 12, y + 8, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    if (o.type === "log") {
      ctx.fillStyle = "#b87955";
      ctx.beginPath();
      ctx.roundRect(x, y, o.w, o.h, 12);
      ctx.fill();

      ctx.strokeStyle = "#87553e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x + 9, y + 14, 6, 10, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (o.type === "spikes") {
      ctx.fillStyle = "#f38aa8";
      ctx.beginPath();

      for (let i = 0; i < 4; i++) {
        let xx = x + i * 14;
        ctx.moveTo(xx, groundY);
        ctx.lineTo(xx + 7, groundY - 25);
        ctx.lineTo(xx + 14, groundY);
      }

      ctx.fill();
    }
  }
}

// COLLECTIBLES
function drawCollectibles() {
  for (const c of collectibles) {
    if (c.taken) continue;

    let x = c.x - camera;
    let y = c.y + Math.sin(Date.now() / 250 + c.x) * 5;

    ctx.font = "23px Arial";
    ctx.textAlign = "center";
    ctx.fillText("💗", x, y);
  }
}

// FLUFFY PINK CAT
function drawCat() {
  const x = cat.x - camera;
  const y = cat.y;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(cat.rotation);

  // Shadow
  ctx.fillStyle = "rgba(130,75,105,.13)";
  ctx.beginPath();
  ctx.ellipse(0, cat.r + 5, 24, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail
  ctx.strokeStyle = "#ed83b4";
  ctx.lineWidth = 10;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(15, 9);
  ctx.quadraticCurveTo(37, 15, 28, -10);
  ctx.stroke();

  // Ears
  ctx.fillStyle = "#f38bb9";
  ctx.strokeStyle = "#d9689d";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(-17, -12);
  ctx.lineTo(-19, -35);
  ctx.lineTo(-3, -21);
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(17, -12);
  ctx.lineTo(19, -35);
  ctx.lineTo(3, -21);
  ctx.fill();
  ctx.stroke();

  // Inner ears
  ctx.fillStyle = "#ffc5dd";
  ctx.beginPath();
  ctx.moveTo(-15, -21);
  ctx.lineTo(-17, -30);
  ctx.lineTo(-8, -23);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(15, -21);
  ctx.lineTo(17, -30);
  ctx.lineTo(8, -23);
  ctx.fill();

  // Fluffy body
  let fur = ctx.createRadialGradient(-8, -10, 2, 0, 0, 30);
  fur.addColorStop(0, "#ffe8f3");
  fur.addColorStop(.45, "#ffaed0");
  fur.addColorStop(1, "#e96ca8");

  ctx.fillStyle = fur;
  ctx.strokeStyle = "#d9699e";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.arc(0, 0, cat.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Visible fur strands
  ctx.strokeStyle = "#ffd1e5";
  ctx.lineWidth = 2;

  for (let i = 0; i < 32; i++) {
    let a = i * Math.PI * 2 / 32;
    let sx = Math.cos(a) * 19;
    let sy = Math.sin(a) * 19;

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(
      Math.cos(a) * 25,
      Math.sin(a) * 25
    );
    ctx.stroke();
  }

  // Face
  const falling = cat.expression === "surprised";
  const jumping = cat.expression === "jump";
  const happy = cat.expression === "happy";

  ctx.fillStyle = "#63384e";

  if (jumping) {
    ctx.strokeStyle = "#63384e";
    ctx.lineWidth = 2.5;

    for (let side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * 8, -4, 3, Math.PI, 0);
      ctx.stroke();
    }
  } else {
    for (let side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(
        side * 8, -4,
        2.5, falling ? 4 : 3.5,
        0, 0, Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(side * 7, -5, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#63384e";
    }
  }

  // Blush
  ctx.fillStyle = "#f47cae";
  ctx.globalAlpha = .65;

  ctx.beginPath();
  ctx.ellipse(-14, 6, 5, 3, 0, 0, Math.PI * 2);
  ctx.ellipse(14, 6, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // Nose
  ctx.fillStyle = "#b45a83";
  ctx.beginPath();
  ctx.arc(0, 5, 2, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  ctx.strokeStyle = "#9c4c73";
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  if (falling) {
    ctx.arc(0, 11, 3, 0, Math.PI * 2);
  } else {
    ctx.moveTo(0, 7);
    ctx.quadraticCurveTo(-3, 12, -6, 8);
    ctx.moveTo(0, 7);
    ctx.quadraticCurveTo(3, 12, 6, 8);
  }

  ctx.stroke();

  // Whiskers
  ctx.beginPath();
  ctx.moveTo(-14, 7);
  ctx.lineTo(-22, 5);
  ctx.moveTo(-14, 11);
  ctx.lineTo(-22, 13);
  ctx.moveTo(14, 7);
  ctx.lineTo(22, 5);
  ctx.moveTo(14, 11);
  ctx.lineTo(22, 13);
  ctx.stroke();

  // Tiny forehead fluff
  ctx.fillStyle = "#ffcae0";
  ctx.beginPath();
  ctx.arc(0, -20, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// LEVEL FINISH
function drawFinish() {
  let x = worldEnd - camera;

  ctx.fillStyle = "#fff";
  ctx.fillRect(x, groundY - 100, 5, 100);

  ctx.fillStyle = "#ff8db8";
  ctx.beginPath();
  ctx.moveTo(x + 5, groundY - 100);
  ctx.lineTo(x + 58, groundY - 80);
  ctx.lineTo(x + 5, groundY - 60);
  ctx.fill();

  ctx.fillStyle = "#d86698";
  ctx.font = "bold 13px Trebuchet MS";
  ctx.fillText("FINISH ♡", x - 18, groundY - 115);
}

// PARTICLES
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 35;
    ctx.fillStyle = "#ff9dc5";
    ctx.beginPath();
    ctx.arc(p.x - camera, p.y, 4, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  }

  particles = particles.filter(p => p.life > 0);
  ctx.globalAlpha = 1;
}

// GAME UPDATE
function update() {
  if (!running) return;

  const oldY = cat.y;

  // Smooth movement
  if (input.left || keys.ArrowLeft || keys.a)
    cat.vx -= .55;

  if (input.right || keys.ArrowRight || keys.d)
    cat.vx += .55;

  cat.vx *= .90;
  cat.vx = Math.max(-6, Math.min(6, cat.vx));

  cat.x += cat.vx;

  // Gravity
  cat.vy += gravity;
  cat.vy = Math.min(cat.vy, 11);
  cat.y += cat.vy;

  // Smooth jump
  const jump = input.jump || keys.ArrowUp ||
               keys.w || keys[" "];

  if (jump && !cat.grounded && !cat.jumpBuffer) {
    cat.jumpBuffer = 1;
  }

  if (jump && cat.grounded && !cat.jumpLock) {
    cat.vy = -10.8;
    cat.grounded = false;
    cat.expression = "jump";
    cat.jumpLock = true;
  }

  if (!jump) cat.jumpLock = false;

  // Ground collision
  cat.grounded = false;

  if (cat.y + cat.r >= groundY && cat.vy >= 0) {
    cat.y = groundY - cat.r;
    cat.vy = 0;
    cat.grounded = true;
  }

  // Smooth rolling
  cat.rotation += cat.vx * .035;

  if (cat.grounded) {
    cat.expression = "happy";
  } else if (cat.vy > 5) {
    cat.expression = "surprised";
  }

  // Obstacle collision
  for (const o of obstacles) {
    const horizontal =
      cat.x + cat.r * .75 > o.x &&
      cat.x - cat.r * .75 < o.x + o.w;

    const vertical =
      cat.y + cat.r > groundY - o.h;

    if (horizontal && vertical) {
      // Bump back instead of instant death
      cat.x = o.x - cat.r - 2;
      cat.vx = -1.5;
      cat.vy = -5.5;
      cat.grounded = false;
      cat.expression = "surprised";
      break;
    }
  }

  // Collect hearts
  for (const c of collectibles) {
    if (!c.taken &&
        Math.hypot(cat.x - c.x, cat.y - c.y) < 34) {
      c.taken = true;
      hearts++;
      document.getElementById("gems").textContent =
        "💗 " + hearts;

      cat.expression = "happy";
      cat.expressionTime = 40;

      for (let i = 0; i < 10; i++) {
        particles.push({
          x: c.x,
          y: c.y,
          vx: (Math.random() - .5) * 5,
          vy: (Math.random() - .5) * 5,
          life: 35
        });
      }
    }
  }

  // No cliffs: the ground is continuous!
  cat.x = Math.max(cat.r, Math.min(worldEnd + 100, cat.x));

  // Camera follows kitty
  camera = Math.max(0, Math.min(
    worldEnd - W + 100,
    cat.x - W * .35
  ));

  // Progress
  let progress = Math.min(100, cat.x / worldEnd * 100);
  document.getElementById("bar").style.width = progress + "%";

  // Finish level
  if (cat.x >= worldEnd) {
    running = false;

    document.querySelector("#screen h1").textContent =
      level === 100 ? "You did it! 🏆" : "Purrfect! 🎉";

    document.querySelector("#description").innerHTML =
      level === 100
      ? "You completed all 100 levels!<br>Our fluffy kitty is so proud of you! ♡"
      : "Level " + level + " completed! ♡<br>You collected " +
        hearts + " hearts!<br>Ready for the next adventure?";

    document.getElementById("play").textContent =
      level === 100 ? "PLAY AGAIN ♡" : "NEXT LEVEL →";

    document.getElementById("screen").style.display = "flex";
  }
}

// DRAW
function draw() {
  drawBackground();
  drawGround();
  drawFlowers();
  drawObstacles();
  drawCollectibles();
  drawFinish();
  drawParticles();
  drawCat();
}

function drawBackground() {
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#fff1f8");
  g.addColorStop(1, "#ffd8e9");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 10; i++) {
    let x = ((i * 190 - camera * .2) % (W + 250) + W + 250) % (W + 250) - 100;
    let y = 90 + (i % 3) * 65;

    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 23, y - 12, 27, 0, Math.PI * 2);
    ctx.arc(x + 48, y, 19, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// START / NEXT LEVEL
function startLevel() {
  if (level === 100 && !running) {
    level = 1;
    hearts = 0;
  } else if (cat.x >= worldEnd) {
    level++;
  }

  if (level > 100) level = 1;

  buildLevel(level);

  cat.x = 100;
  cat.y = groundY - cat.r;
  cat.vx = 0;
  cat.vy = 0;
  cat.rotation = 0;
  cat.grounded = true;
  cat.expression = "happy";
  cat.jumpLock = false;
  cat.jumpBuffer = 0;

  camera = 0;
  running = true;

  document.getElementById("level").textContent =
    "LEVEL " + String(level).padStart(2, "0") + " / 100";

  document.getElementById("bar").style.width = "0%";
  document.getElementById("gems").textContent = "💗 " + hearts;

  document.getElementById("screen").style.display = "none";
}

document.getElementById("play").addEventListener("click", () => {
  if (level === 100 && cat.x >= worldEnd) {
    level = 1;
    hearts = 0;
  } else if (cat.x >= worldEnd) {
    level++;
  }
  startLevel();
});

// KEYBOARD
addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key))
    e.preventDefault();

  keys[e.key] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
});

// MOBILE CONTROLS
function bind(id, property) {
  const el = document.getElementById(id);

  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    input[property] = true;
    el.setPointerCapture(e.pointerId);
  });

  ["pointerup", "pointercancel", "lostpointercapture"].forEach(event => {
    el.addEventListener(event, () => {
      input[property] = false;
    });
  });
}

bind("left", "left");
bind("right", "right");
bind("jump", "jump");

buildLevel(1);
loop();
